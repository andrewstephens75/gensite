[project]
name = "gensite"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "exif>=1.6.1",
    "feedgen>=1.0.0",
    "lxml>=6.1.3",
    "markdown==2.6.11",   # latest version that works with the custom plugins
    "pygments>=2.21.0",
]

[project.scripts]
    gensite="gensite.cli:main"

[build-system]
requires = ["uv-build>=0.1.0"]
build-backend = "uv_build"